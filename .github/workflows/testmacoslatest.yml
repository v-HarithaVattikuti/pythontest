name: Test version on Macos Latest

on:
  workflow_dispatch:

jobs:
  buildv6:
    name: Test on v6
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest , macos-15-intel,ubuntu-latest,windows-latest,windows-11-arm]
        python-version: ["3.15"]
    
    steps:
        - uses: actions/checkout@v6

        - name: Set up Python using v5
          uses: actions/setup-python@v7
          with:
              python-version: ${{ matrix.python-version }}
              check-latest: true
