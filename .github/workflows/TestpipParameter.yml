name: Test Setup pip parameter

on: 
  workflow_dispatch:

jobs:

  python-pip-dependencies-caching:
    name: Test pip (Python ${{ matrix.python-version}}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-22.04,
            ubuntu-latest,
            ubuntu-24.04-arm,
            windows-latest,
            windows-11-arm,
            macos-15-intel,
            macos-latest
          ]
        python-version:
        - 'pypy3.11' # the latest available version of PyPy that supports Python 3.11
        - 'pypy3.11-v7.3.23' # Python 3.11 and PyPy 7.3.23
        - 'pypy-3.11-v7.3.x'
        - 'pypy3.11-nightly'
        - 'pypy-3.11'
        - 'pypy-3.11-v7.x'
        - '>=3.11 <3.15'
        - '3.16.0-alpha.1'
        - '3.16-dev'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: ./
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: pip install numpy pandas requests
